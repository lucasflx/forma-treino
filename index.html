 else if(variant==='abs'){if(finish){pt('head',52,66);pt('neck',60,78);pt('sl',62,87);pt('sr',73,87);pt('hip',83,115);pt('kl',60,140);pt('kr',99,143);pt('al',48,157);pt('ar',110,159)}else{pt('kl',54,140);pt('kr',100,141);pt('al',44,159);pt('ar',116,160)}pt('el',57,p.sl[1]+1);pt('er',85,p.sr[1]+1);pt('wl',65,p.sl[1]-6);pt('wr',80,p.sr[1]-6);addon='<path d="M77 7 V45" stroke="#91ad98" stroke-width="4"/>'}
 else if(variant==='calf'&&finish){pt('al',62,151);pt('ar',89,151)}
 let stick=`<g fill="none" stroke="${palette.body}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M${p.neck.join(' ')} L${p.hip.join(' ')}"/><path d="M${p.sl.join(' ')} L${p.el.join(' ')} L${p.wl.join(' ')}"/><path d="M${p.sr.join(' ')} L${p.er.join(' ')} L${p.wr.join(' ')}"/><path d="M${p.hip.join(' ')} L${p.kl.join(' ')} L${p.al.join(' ')}"/><path d="M${p.hip.join(' ')} L${p.kr.join(' ')} L${p.ar.join(' ')}"/></g>`;
 stick+=`<circle cx="${p.head[0]}" cy="${p.head[1]}" r="12" fill="${palette.skin}" stroke="${palette.body}" stroke-width="3"/>`;
 if(['bench','incline','chestpress','onearm','press','lateral','curl','goblet','squat','stiff','lunge','hip'].includes(variant)){for(const hand of ['wl','wr']){const [x,y]=p[hand];stick+=`<path d="M${x-8} ${y}h16" stroke="${palette.weight}" stroke-width="7" stroke-linecap="round"/>`}}
 return `<g>${addon}${stick}</g>`};
 if(mini){return `<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" aria-label="Esquema ilustrado do exercício"><g transform="translate(-4 4) scale(1.15 .96)">${pose(kind,true)}</g></svg>`}
 return `<svg viewBox="0 0 340 195" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Duas posições esquemáticas do movimento"><path d="M170 22V175" stroke="#d2dfcf" stroke-dasharray="4 6"/><g transform="translate(6 0) scale(.97 1)">${pose(kind,false)}</g><g transform="translate(178 0) scale(.97 1)">${pose(kind,true)}</g><text class="svg-caption" x="74" y="184" text-anchor="middle">INÍCIO</text><text class="svg-caption" x="253" y="184" text-anchor="middle">FIM</text></svg>`;
}
function lineChart(rows,field,unit){const pts=rows.filter(r=>Number.isFinite(Number(r[field]))&&r[field]!==''&&r[field]!=null).sort((a,b)=>a.date.localeCompare(b.date));if(!pts.length)return `<div class="empty">Ainda não há medições.<br>Adicione sua primeira medida para ver a tendência.</div>`;
const vals=pts.map(p=>+p[field]),min=Math.min(...vals),max=Math.max(...vals),low=Math.floor((min-2)*10)/10,high=Math.ceil((max+2)*10)/10,xx=i=>38+(i/Math.max(1,pts.length-1))*464,yy=v=>170-(v-low)/Math.max(1,high-low)*126,poly=pts.map((p,i)=>`${xx(i)},${yy(+p[field])}`).join(' '),labels=pts.length<=6?pts:pts.filter((_,i)=>i===0||i===pts.length-1||i%Math.ceil(pts.length/5)===0);
return `<div class="chart"><svg viewBox="0 0 520 220" role="img" aria-label="Evolução de ${unit}"><g stroke="#dce8dc" stroke-width="1">${[0,1,2,3].map(j=>`<line x1="38" y1="${170-j*42}" x2="502" y2="${170-j*42}"/>`).join('')}</g>${[0,1,2,3].map(j=>`<text x="30" y="${174-j*42}" font-size="11" fill="#879689" text-anchor="end">${fmt(low+(high-low)*j/3)}</text>`).join('')}<polyline points="${poly}" fill="none" stroke="#277549" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${xx(i)}" cy="${yy(+p[field])}" r="4" fill="#c7f483" stroke="#277549" stroke-width="2"><title>${formatDate(p.date)}: ${fmt(p[field])} ${unit}</title></circle>`).join('')}${labels.map(p=>`<text x="${xx(pts.indexOf(p))}" y="195" text-anchor="middle" font-size="10" fill="#88988c">${formatDate(p.date).slice(0,5)}</text>`).join('')}</svg></div>`}
function progress(){const sess=[...data.sessions].reverse(),body=[...data.metrics].sort((a,b)=>a.date.localeCompare(b.date));let total=sess.reduce((sum,s)=>sum+s.sets.reduce((t,r)=>t+Number(r.kg)*Number(r.reps),0),0);const most=Object.entries(exercises).filter(([id])=>data.sessions.some(s=>s.sets.some(x=>x.id===id))).sort((a,b)=>{const ma=Math.max(...data.sessions.flatMap(s=>s.sets.filter(x=>x.id===a[0]).map(x=>x.kg)),0);const mb=Math.max(...data.sessions.flatMap(s=>s.sets.filter(x=>x.id===b[0]).map(x=>x.kg)),0);return mb-ma}).slice(0,6);
return `<div class="eyebrow">ACOMPANHAMENTO</div><h1 class="page-title">Evolução de verdade<span style="color:#86b16c">.</span></h1><p class="page-sub">Acompanhe peso, cintura e evolução de exercícios. Mudanças de força e medidas contam mais que um único número na balança.</p><div class="kpi-row"><div class="kpi"><span class="k-label">Treinos registrados</span><span class="k-value">${sess.length}</span></div><div class="kpi"><span class="k-label">Séries concluídas</span><span class="k-value">${sess.reduce((t,s)=>t+s.sets.length,0)}</span></div><div class="kpi"><span class="k-label">Volume total aprox.</span><span class="k-value">${fmt(total,0)}</span><span class="k-info">kg·rep*</span></div><div class="kpi"><span class="k-label">Medições físicas</span><span class="k-value">${body.length}</span></div></div>
 <div class="card"><div class="section-head" style="margin-top:0"><h2>Registrar medidas</h2></div><form id="metric-form" class="metric-form"><div class="form-field"><label>Data</label><input name="date" type="date" value="${isoDate()}" required></div><div class="form-field"><label>Peso (kg)</label><input name="weight" type="number" inputmode="decimal" step="0.1" min="25" max="350" placeholder="89,0"></div><div class="form-field"><label>Cintura (cm)</label><input name="waist" type="number" inputmode="decimal" step="0.1" min="30" max="220" placeholder="Ex.: 96"></div><button class="btn solid" type="submit">Salvar medida</button></form><p class="quiet">Meça a cintura sempre no mesmo ponto, sem prender a barriga. Peso: idealmente nas mesmas condições, pela manhã.</p></div>
 <div class="two-col" style="margin-top:16px"><div class="card"><div class="section-head" style="margin-top:0"><h2>Peso corporal</h2><span class="section-note">kg</span></div>${lineChart(body,'weight','kg')}</div><div class="card"><div class="section-head" style="margin-top:0"><h2>Circunferência da cintura</h2><span class="section-note">cm</span></div>${lineChart(body,'waist','cm')}</div></div>
 <div class="section-head"><h2>Histórico de sessões</h2></div><div class="card">${sess.length?sess.slice(0,40).map(s=>`<div class="history-row"><strong>${formatDate(s.date)}</strong><span class="badge-green">Treino ${s.day}</span><span>${s.sets.length} séries · ${fmt(s.sets.reduce((a,x)=>a+x.kg*x.reps,0),0)} kg·rep <small class="muted">${esc(s.note||'')}</small></span><button class="btn small line" data-detail="${s.id}">Ver</button></div>`).join(''):'<div class="empty">Seu histórico aparecerá aqui depois do primeiro treino salvo.</div>'}</div>
 <div class="section-head"><h2>Maiores cargas registradas</h2></div><div class="card">${most.length?most.map(([id,e])=>{const values=data.sessions.flatMap(s=>s.sets.filter(x=>x.id===id).map(x=>Number(x.kg)));return `<div class="history-row" style="grid-template-columns:1fr auto"><div><strong>${esc(e.name)}</strong><div class="quiet">${esc(e.unit)}</div></div><span class="badge-green">${fmt(Math.max(...values))} kg</span></div>`}).join(''):'<div class="empty">Os recordes individuais surgirão após seus primeiros treinos.</div>'}<p class="quiet">* Volume calculado a partir dos pesos registrados, sem padronização entre máquinas ou lados. Para exercícios com halteres, o registro indica a carga por halter. Não compare volume absoluto de máquinas diferentes.</p></div>
 <div class="section-head"><h2>Medições recentes</h2></div><div class="card">${body.length?[...body].reverse().slice(0,10).map(m=>`<div class="history-row" style="grid-template-columns:105px 1fr 1fr auto"><strong>${formatDate(m.date)}</strong><span>${m.weight?fmt(m.weight)+' kg':'—'}</span><span>${m.waist?fmt(m.waist)+' cm':'—'}</span><button class="btn small line" data-del-metric="${esc(m.date)}">Excluir</button></div>`).join(''):'<div class="empty">Nenhuma medida registrada ainda.</div>'}</div>`}
function settings(){return `<div class="eyebrow">PERSONALIZAÇÃO E DADOS</div><h1 class="page-title">Ajustes<span style="color:#86b16c">.</span></h1><p class="page-sub">Altere as cargas para testes iniciais, a data do ciclo e faça backup do diário. Seus registros são privados e permanecem neste navegador.</p>
 <div class="card"><h2 style="margin-top:0">Informações do ciclo</h2><div class="profile"><div class="form-field"><label>Data de início da semana 1</label><input type="date" id="startdate" value="${esc(data.settings.startDate)}"></div><div class="form-field"><label>Peso de referência (kg)</label><input type="number" min="25" max="350" step="0.1" id="startweight" value="${esc(data.settings.weight)}"></div></div><div style="margin-top:12px"><button class="btn solid" data-save-settings="1">Salvar ajustes</button></div><p class="quiet">Nas semanas 1–2 o site indica 2 séries de cada exercício. A partir da semana 3, usa o volume completo da ficha.</p></div>
 <div class="section-head"><h2>Cargas-teste por exercício</h2></div><div class="card"><div class="tip" style="margin-bottom:13px"><strong>Importante:</strong> estes valores não são recomendação personalizada de força. São apenas estimativas conservadoras para um teste de readaptação. Reduza sempre que necessário, busque terminar com 3–4 repetições de reserva e não teste máximos. A máquina pode ter resistência muito diferente da carga indicada.</div><div class="settings-list">${allExercises().map(([k,id,e])=>`<div class="settings-item"><div><strong>${esc(e.name)}</strong><small>Treino ${k} · teste: ${esc(e.range)}</small></div><input aria-label="Carga teste de ${esc(e.name)}" data-target="${id}" type="number" min="0" max="500" step="0.5" value="${esc(data.targets[id]??e.load)}"><div class="unit">${esc(e.unit)}</div></div>`).join('')}</div><p class="quiet">Ao editar a carga aqui, as próximas fichas sem registros usarão esse peso. Cargas já preenchidas podem ser alteradas diretamente no treino.</p></div>
 <div class="section-head"><h2>Backup e exportação</h2></div><div class="card"><div class="export-actions"><button class="btn solid" data-export-json="1">↓ Backup completo (.json)</button><button class="btn line" data-export-csv="1">↓ Séries em CSV</button><label class="btn ghost" for="importfile" style="cursor:pointer">↑ Restaurar backup</label><input id="importfile" type="file" accept=".json,application/json" style="display:none"></div><p class="quiet">Exporte um backup após os treinos. Não há login, nuvem nem sincronização entre celular e computador. Para restaurar em outro dispositivo, importe o JSON exportado. Se limpar dados do navegador, seu histórico local pode desaparecer.</p></div>
 <div class="section-head"><h2>Recomeçar</h2></div><div class="card"><p class="mini-note">Você pode iniciar outro ciclo mantendo histórico e medidas. Para excluir todos os dados, será necessária confirmação.</p><div class="export-actions"><button class="btn line" data-reset-cycle="1">Reiniciar ciclo hoje</button><button class="btn line" data-reset-all="1" style="color:#a33b34">Excluir todos os dados</button></div></div>`}
function detail(id){const s=data.sessions.find(x=>x.id===id);if(!s){render('progress');return};const groups=s.sets.reduce((a,x)=>{(a[x.id] ||= []).push(x);return a;},{});return `<div class="eyebrow">HISTÓRICO · ${formatDate(s.date)}</div><h1 class="page-title">Treino ${s.day}<span style="color:#86b16c">.</span></h1><p class="page-sub">Registro salvo. As séries abaixo são um retrato daquele treino.</p><button class="btn line small" data-nav="progress">← Voltar ao histórico</button><div style="height:15px"></div><div class="card">${Object.entries(groups).map(([id,sets])=>`<div style="padding:13px 0;border-bottom:1px solid #e8ece6"><strong>${esc(exercises[id]?.name||id)}</strong><div class="quiet">${sets.map(s=>`${fmt(s.kg)} kg × ${s.reps} ${id==='plank'?'seg':'reps'} (RIR ${s.rir})`).join(' · ')}</div></div>`).join('')}<div class="workout-actions"><span class="quiet">${s.sets.length} séries</span><button class="btn line small" style="color:#ac4a42" data-del-session="${s.id}">Excluir treino</button></div></div>`}
function render(view=currentView){currentView=view;window.scrollTo({top:0,behavior:'instant'});let body=view==='home'?home():view==='train'?train():view==='progress'?progress():view==='settings'?settings():view.startsWith('detail:')?detail(view.slice(7)):home();shell(body)}
const notify=msg=>{const old=document.querySelector('.toast');if(old)old.remove();let n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);clearTimeout(toastTO);toastTO=setTimeout(()=>n.remove(),3100)};
const fileDownload=(content,name,mime)=>{const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};
function csvExport(){const rows=[['data','treino','exercicio','serie','carga_kg','unidade','repeticoes_ou_segundos','rir','observacao']];data.sessions.forEach(s=>s.sets.forEach((x,i)=>rows.push([s.date,s.day,exercises[x.id]?.name||x.id,i+1,x.kg,exercises[x.id]?.unit||'',x.reps,x.rir,x.note||''])));return '\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\r\n')}
function saveSession(day){const w=workoutDefs[day];let sets=[];for(const id of w.list){const d=getDraft(day,id);for(const s of d.sets){const kg=Number(s.kg),reps=Number(s.reps),rir=Number(s.rir);if(reps>0&&Number.isFinite(kg)&&kg>=0&&rir>=0&&rir<=5){sets.push({id,kg,reps,rir,note:d.note||''})}}}if(!sets.length){notify('Preencha as repetições de pelo menos uma série.');return}if(!confirm(`Salvar treino ${day} com ${sets.length} séries?`))return;data.sessions.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,6),date:isoDate(),day,sets});delete data.drafts[day];save();notify(`Treino ${day} salvo! Continue evoluindo.`);render('progress')}
function updateDraftField(el){const [day,id,index,field]=el.dataset.set.split('|'),d=getDraft(day,id);if(field==='reps'||field==='kg'){d.sets[Number(index)][field]=el.value===''?'':Number(el.value)}else d.sets[Number(index)][field]=Number(el.value);save()}
function timerStart(s){clearInterval(timer);timerSeconds=s;renderTimer();timer=setInterval(()=>{timerSeconds--;renderTimer();if(timerSeconds<=0){clearInterval(timer);timer=null;notify('Descanso concluído.');}},1000)}
function renderTimer(){let el=document.getElementById('timerchip');if(!el){el=document.createElement('div');el.id='timerchip';el.style='position:fixed;top:14px;right:14px;z-index:100;background:#203e2c;color:#fff;border-radius:14px;padding:13px 18px;box-shadow:0 9px 20px #14392420;font-weight:750';document.body.append(el)}if(timerSeconds>0)el.textContent=`⏱ Descanso ${Math.floor(timerSeconds/60)}:${String(timerSeconds%60).padStart(2,'0')}`;else el.remove()}
const actions={};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-nav],[data-go-workout],[data-day],[data-expand],[data-use-rec],[data-save-session],[data-timer],[data-save-settings],[data-export-json],[data-export-csv],[data-reset-cycle],[data-reset-all],[data-detail],[data-del-session],[data-del-metric]');if(!el)return;
if(el.dataset.nav){openEx=null;render(el.dataset.nav);return}
if(el.dataset.goWorkout){data.chosen=el.dataset.goWorkout;save();openEx=null;render('train');return}
if(el.dataset.day){data.chosen=el.dataset.day;save();openEx=null;render('train');return}
if(el.dataset.expand){openEx=openEx===el.dataset.expand?'__none__':el.dataset.expand;render('train');document.getElementById('ex-'+el.dataset.expand)?.scrollIntoView({block:'nearest'});return}
if(el.dataset.useRec){const id=el.dataset.useRec,d=getDraft(data.chosen,id),rec=recommendation(id);d.sets.forEach(s=>s.kg=rec.weight);save();openEx=id;render('train');notify('Sugestão aplicada. Ajuste se necessário.');return}
if(el.dataset.saveSession){saveSession(el.dataset.saveSession);return}
if(el.dataset.timer){timerStart(Number(el.dataset.timer));notify(`Descanso de ${el.dataset.timer}s iniciado.`);return}
if(el.dataset.saveSettings){const d=document.getElementById('startdate').value;const w=Number(document.getElementById('startweight').value);if(!d||!Number.isFinite(w)||w<25||w>350){notify('Confira a data e o peso.');return}data.settings.startDate=d;data.settings.weight=w;save();render('settings');notify('Configurações salvas.');return}
if(el.dataset.exportJson){fileDownload(JSON.stringify(data,null,2),`FORMA-backup-${isoDate()}.json`,'application/json');notify('Backup gerado. Guarde o arquivo.');return}
if(el.dataset.exportCsv){fileDownload(csvExport(),`FORMA-series-${isoDate()}.csv`,'text/csv;charset=utf-8');return}
if(el.dataset.resetCycle){if(!confirm('Reiniciar a contagem da semana 1 hoje e manter todo o histórico?'))return;data.settings.startDate=mondayOf(isoDate());data.drafts={};save();render('settings');notify('Novo ciclo iniciado!');return}
if(el.dataset.resetAll){if(!confirm('ATENÇÃO: excluir permanentemente todos os treinos e medições salvos neste navegador? Faça backup antes.'))return;if(!confirm('Confirmar exclusão de TODOS os registros?'))return;data=initState();save();render('home');notify('Dados locais reiniciados.');return}
if(el.dataset.detail){render('detail:'+el.dataset.detail);return}
if(el.dataset.delSession){if(!confirm('Excluir este treino definitivamente?'))return;data.sessions=data.sessions.filter(x=>x.id!==el.dataset.delSession);save();render('progress');notify('Treino excluído.');return}
if(el.dataset.delMetric){if(!confirm('Excluir a medida desta data?'))return;data.metrics=data.metrics.filter(x=>x.date!==el.dataset.delMetric);save();render('progress');return}
});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-expand]')){ev.preventDefault();ev.target.click()}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.set)updateDraftField(el);else if(el.dataset.exNote){const[day,id]=el.dataset.exNote.split('|');getDraft(day,id).note=el.value;save()}else if(el.dataset.target){const n=Number(el.value);if(el.value!==''&&n>=0&&n<=500){data.targets[el.dataset.target]=n;save()}}});
document.addEventListener('submit',ev=>{if(ev.target.id!=='metric-form')return;ev.preventDefault();const f=new FormData(ev.target),date=f.get('date'),weight=f.get('weight'),waist=f.get('waist'),w=weight===''?null:Number(weight),c=waist===''?null:Number(waist);if((w===null&&c===null)||(w!==null&&(w<25||w>350))||(c!==null&&(c<30||c>220))){notify('Informe pelo menos uma medida válida.');return}data.metrics=data.metrics.filter(m=>m.date!==date);data.metrics.push({date,weight:w,waist:c});data.metrics.sort((a,b)=>a.date.localeCompare(b.date));save();render('progress');notify('Medidas salvas.');});
document.addEventListener('change',ev=>{const el=ev.target;if(el.id==='importfile'&&el.files?.[0]){const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!Array.isArray(imported.sessions)||!Array.isArray(imported.metrics)||!imported.settings)throw Error('Formato inválido');if(!confirm('Restaurar backup e SUBSTITUIR os registros atuais deste navegador?'))return;data=imported;normalize();save();render('home');notify('Backup restaurado.')}catch(err){notify('Este arquivo não é um backup válido do FORMA.')}};reader.readAsText(el.files[0]);}});
if(!storeOk)setTimeout(()=>notify('Armazenamento local indisponível. Exporte seus dados após treinar.'),500);
render();
})();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
